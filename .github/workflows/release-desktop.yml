name: Release desktop

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Must match the VERSION file, for example v1.6.0
        required: true
        type: string

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  QISITV_UPDATER_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/desktop-update.json
  UPDATER_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download

jobs:
  preflight:
    name: Validate and open draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: Require release branch
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "Desktop updater releases can only be dispatched from main. Current ref: ${{ github.ref }}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Require updater keys
        env:
          QISITV_UPDATER_PRIVATE_KEY: ${{ secrets.QISITV_UPDATER_PRIVATE_KEY }}
          QISITV_UPDATER_PUBLIC_KEY: ${{ vars.QISITV_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${QISITV_UPDATER_PRIVATE_KEY:-}" ]]; then
            echo "Missing GitHub Actions secret QISITV_UPDATER_PRIVATE_KEY."
            echo "It must be standard base64 of a 64-byte Ed25519 private key."
            echo "Generate a keypair locally with:"
            echo "  cd backend && go run ./cmd/update-release gen-key --private-key /path/to/qisitv-updater.private --public-key /path/to/qisitv-updater.public"
            echo "Put the private file contents in the repository secret. Do not commit that file."
            echo "Unsigned automatic updates are not published."
            exit 1
          fi
          if [[ -z "${QISITV_UPDATER_PUBLIC_KEY:-}" ]]; then
            echo "Missing GitHub Actions variable QISITV_UPDATER_PUBLIC_KEY."
            echo "It must be standard base64 of the matching 32-byte Ed25519 public key."
            echo "Unsigned automatic updates are not published."
            exit 1
          fi

      - name: Validate version, changelog, keys, and uniqueness
        id: meta
        env:
          QISITV_UPDATER_PRIVATE_KEY: ${{ secrets.QISITV_UPDATER_PRIVATE_KEY }}
          QISITV_UPDATER_PUBLIC_KEY: ${{ vars.QISITV_UPDATER_PUBLIC_KEY }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        working-directory: backend
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < ../VERSION)"
          commit="$(git -C .. rev-parse HEAD)"
          go test ./cmd/update-release

          greater_args=()
          latest=""
          release_tags="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName')"
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            if go run ./cmd/update-release validate-version --version "$tag" >/dev/null 2>&1; then
              if [[ -z "$latest" ]] || go run ./cmd/update-release validate-version --version "$tag" --greater-than "$latest" >/dev/null 2>&1; then
                latest="$tag"
              fi
            fi
          done <<< "$release_tags"
          if [[ -n "$latest" ]]; then
            greater_args+=(--greater-than "$latest")
          fi
          go run ./cmd/update-release validate-version \
            --version "$version" \
            --confirm "$CONFIRM_VERSION" \
            "${greater_args[@]}"

          go run ./cmd/update-release changelog --file ../CHANGELOG.md --version "$version" > "$RUNNER_TEMP/release-notes.md"
          go run ./cmd/update-release print-ldflags >/dev/null

          derived="$(go run ./cmd/update-release public-key | tr -d '\r\n')"
          expected="$(printf '%s' "$QISITV_UPDATER_PUBLIC_KEY" | tr -d '\r\n')"
          if [[ "$derived" != "$expected" ]]; then
            echo "Private key does not derive GitHub variable QISITV_UPDATER_PUBLIC_KEY."
            echo "Release binaries and the signed feed must use the same public key."
            exit 1
          fi

          if gh release view "$version" >/dev/null 2>&1; then
            echo "GitHub release $version already exists. Updater version assets are immutable and cannot be overwritten."
            echo "If a failed draft was never published, delete it and its tag only after confirming it was never public."
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "Git tag $version already exists. Choose a new VERSION; published tags are not reused."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Prepare release gate dependencies
        run: |
          sh plugin-packages/build-packages.sh
          cd web
          bun install --frozen-lockfile

      - name: Local release contract gate
        run: ./scripts/verify-qisitv-local-release.sh

      - name: Create draft GitHub release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --draft \
            --title "qisiTV $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "${{ github.sha }}"

  build:
    name: Build ${{ matrix.platform }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            wails_platform: darwin/arm64
          - os: macos-15-intel
            platform: darwin-amd64
            wails_platform: darwin/amd64
          - os: windows-2022
            platform: windows-amd64
            wails_platform: windows/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install MSYS2 UCRT64 GCC
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          release: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils

      - name: Assert DWARF 5 CGO compiler
        if: runner.os == 'Windows'
        env:
          MSYSTEM_PREFIX: ${{ steps.msys2.outputs.msys2-location }}\ucrt64
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-windows-dwarf5-cgo.ps1

      - name: Build official plugin packages
        if: runner.os != 'Windows'
        run: sh plugin-packages/build-packages.sh

      - name: Build macOS desktop
        if: runner.os != 'Windows'
        env:
          QISITV_SKIP_LOCAL_VERIFY: "1"
          QISITV_WAILS_PLATFORM: ${{ matrix.wails_platform }}
          QISITV_UPDATER_PUBLIC_KEY: ${{ vars.QISITV_UPDATER_PUBLIC_KEY }}
        run: ./scripts/build-qisitv-release.sh

      - name: Build Windows desktop
        if: runner.os == 'Windows'
        env:
          QISITV_UPDATER_PUBLIC_KEY: ${{ vars.QISITV_UPDATER_PUBLIC_KEY }}
          CGO_ENABLED: "1"
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-qisitv-windows-release.ps1

      - name: Package updater zip
        working-directory: backend
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          input="cmd/desktop/build/bin"
          if [[ "$PLATFORM" == darwin-* ]]; then
            input="$input/qisiTV.app"
          fi
          go run ./cmd/update-release package \
            --platform "$PLATFORM" \
            --input "$input" \
            --output "../dist/qisiTV-${VERSION}-${PLATFORM}.zip"

      - name: Store platform zip for publication
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/qisiTV-${{ needs.preflight.outputs.version }}-${{ matrix.platform }}.zip
          if-no-files-found: error

  publish:
    name: Sign feed and publish
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.preflight.outputs.version }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
      QISITV_UPDATER_PRIVATE_KEY: ${{ secrets.QISITV_UPDATER_PRIVATE_KEY }}
      QISITV_UPDATER_PUBLIC_KEY: ${{ vars.QISITV_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Retrieve completed platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Check complete platform set
        run: |
          set -euo pipefail
          mapfile -t zips < <(find dist -maxdepth 1 -name "qisiTV-${VERSION}-*.zip" | LC_ALL=C sort)
          if [[ "${#zips[@]}" -ne 3 ]]; then
            echo "Expected 3 platform zips on draft $VERSION before signing desktop-update.json, found ${#zips[@]}."
            printf '%s\n' "${zips[@]}"
            exit 1
          fi

      - name: Sign and verify desktop-update.json
        working-directory: backend
        run: |
          set -euo pipefail
          go run ./cmd/update-release sign \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --changelog ../CHANGELOG.md \
            --download-base "$UPDATER_DOWNLOAD_BASE" \
            --expect-public-key "$QISITV_UPDATER_PUBLIC_KEY" \
            --require-platforms darwin-arm64,darwin-amd64,windows-amd64 \
            --asset "darwin-arm64=../dist/qisiTV-${VERSION}-darwin-arm64.zip" \
            --asset "darwin-amd64=../dist/qisiTV-${VERSION}-darwin-amd64.zip" \
            --asset "windows-amd64=../dist/qisiTV-${VERSION}-windows-amd64.zip" \
            --output "../dist/desktop-update.json"
          go run ./cmd/update-release verify \
            --envelope "../dist/desktop-update.json" \
            --public-key-text "$QISITV_UPDATER_PUBLIC_KEY"

      - name: Publish signed release
        run: |
          set -euo pipefail
          gh release upload "$VERSION" "dist/desktop-update.json" dist/qisiTV-"$VERSION"-*.zip
          gh release edit "$VERSION" --draft=false --latest
          echo "Published $VERSION. Clients fetch $QISITV_UPDATER_FEED_URL only after this point."
