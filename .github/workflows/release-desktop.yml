name: Release desktop

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Must match the VERSION file, for example v1.6.0
        required: true
        type: string
      reuse_build_run_id:
        description: Optional workflow run ID with completed 4-platform builds for this version
        required: false
        default: ""
        type: string

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  BEEFTV_UPDATER_FEED_URL: https://updates.beefapi.com/beeftv/desktop-update-v2.json
  UPDATER_DOWNLOAD_BASE: https://updates.beefapi.com/beeftv
  RELEASE_ENDPOINT: ${{ vars.BEEFTV_R2_ENDPOINT }}
  RELEASE_REGION: auto
  RELEASE_BUCKET: beeftv-releases
  LEGACY_COS_ENDPOINT: https://cos.ap-guangzhou.myqcloud.com
  LEGACY_COS_REGION: ap-guangzhou
  LEGACY_COS_BUCKET: beeftv-components-1481187348

jobs:
  preflight:
    name: Validate and open draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      previous_version: ${{ steps.meta.outputs.previous_version }}
    steps:
      - name: Require official main
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "Desktop updater releases can only be dispatched from main. Current ref: ${{ github.ref }}"
            exit 1
          fi
          if [[ "${{ github.repository }}" != "glanderness/BeefTV" ]]; then
            echo "This workflow publishes production updater assets for glanderness/BeefTV only."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Verify minimal release receipt and source digest
        if: inputs.reuse_build_run_id == ''
        run: node scripts/verify-real-generation-release.mjs

      - name: Require updater keys
        env:
          BEEFTV_CNB_TRIGGER_TOKEN: ${{ secrets.BEEFTV_CNB_TRIGGER_TOKEN }}
          BEEFTV_UPDATER_PRIVATE_KEY: ${{ secrets.BEEFTV_UPDATER_PRIVATE_KEY }}
          BEEFTV_UPDATER_PUBLIC_KEY: ${{ vars.BEEFTV_UPDATER_PUBLIC_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BEEFTV_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BEEFTV_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${BEEFTV_CNB_TRIGGER_TOKEN:-}" ]]; then
            echo "Missing GitHub Actions secret BEEFTV_CNB_TRIGGER_TOKEN for the default CNB mirror step."
            exit 1
          fi
          if [[ -z "$RELEASE_ENDPOINT" || -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "Missing bucket-scoped R2 release credentials or endpoint."
            exit 1
          fi
          python3 scripts/publish-desktop-r2.py check-store --provider r2 \
            --endpoint-url "$RELEASE_ENDPOINT" --region "$RELEASE_REGION" \
            --bucket "$RELEASE_BUCKET" --public-base "$UPDATER_DOWNLOAD_BASE"
          if [[ -z "${BEEFTV_UPDATER_PRIVATE_KEY:-}" ]]; then
            echo "Missing GitHub Actions secret BEEFTV_UPDATER_PRIVATE_KEY."
            echo "It must be standard base64 of a 64-byte Ed25519 private key."
            echo "Generate a keypair locally with:"
            echo "  cd backend && go run ./cmd/update-release gen-key --private-key /path/to/beeftv-updater.private --public-key /path/to/beeftv-updater.public"
            echo "Put the private file contents in the repository secret. Do not commit that file."
            echo "Unsigned automatic updates are not published."
            exit 1
          fi
          if [[ -z "${BEEFTV_UPDATER_PUBLIC_KEY:-}" ]]; then
            echo "Missing GitHub Actions variable BEEFTV_UPDATER_PUBLIC_KEY."
            echo "It must be standard base64 of the matching 32-byte Ed25519 public key."
            echo "Unsigned automatic updates are not published."
            exit 1
          fi

      - name: Check legacy COS feed bridge
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BEEFTV_COS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BEEFTV_COS_SECRET_ACCESS_KEY }}
        run: |
          python3 scripts/publish-desktop-r2.py check-store --provider cos \
            --endpoint-url "$LEGACY_COS_ENDPOINT" --region "$LEGACY_COS_REGION" \
            --bucket "$LEGACY_COS_BUCKET"

      - name: Validate version, changelog, keys, and uniqueness
        id: meta
        env:
          BEEFTV_UPDATER_PRIVATE_KEY: ${{ secrets.BEEFTV_UPDATER_PRIVATE_KEY }}
          BEEFTV_UPDATER_PUBLIC_KEY: ${{ vars.BEEFTV_UPDATER_PUBLIC_KEY }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          REUSE_BUILD_RUN_ID: ${{ inputs.reuse_build_run_id }}
        working-directory: backend
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < ../VERSION)"
          commit="$(git -C .. rev-parse HEAD)"
          if [[ -n "${REUSE_BUILD_RUN_ID:-}" ]]; then
            if [[ ! "$REUSE_BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid reuse_build_run_id: $REUSE_BUILD_RUN_ID"
              exit 1
            fi
            run_meta="$(gh api "repos/glanderness/BeefTV/actions/runs/$REUSE_BUILD_RUN_ID")"
            run_branch="$(jq -r '.head_branch' <<< "$run_meta")"
            run_commit="$(jq -r '.head_sha' <<< "$run_meta")"
            if [[ "$run_branch" != "main" || -z "$run_commit" || "$run_commit" == "null" ]]; then
              echo "Reused build run $REUSE_BUILD_RUN_ID must come from main."
              exit 1
            fi
            jobs_meta="$(gh api "repos/glanderness/BeefTV/actions/runs/$REUSE_BUILD_RUN_ID/jobs?per_page=100")"
            for required_job in "Validate and open draft" "Build darwin-arm64" "Build darwin-amd64" "Build windows-amd64" "Build linux-amd64"; do
              job_conclusion="$(jq -r --arg name "$required_job" '[.jobs[] | select(.name == $name)][0].conclusion // ""' <<< "$jobs_meta")"
              if [[ "$job_conclusion" != "success" ]]; then
                echo "Reused build run $REUSE_BUILD_RUN_ID job '$required_job' did not succeed (conclusion: '$job_conclusion')."
                exit 1
              fi
            done
            commit="$run_commit"
          fi
          go test ./cmd/update-release

          curl --fail --location --retry 3 --max-time 60 \
            https://github.com/glanderness/BeefTV/releases/download/depth-runtime-mirrors-v1/depth-runtime-manifest.v2.json \
            --output "$RUNNER_TEMP/depth-manifest.json"
          go run ./cmd/update-release verify-depth --input "$RUNNER_TEMP/depth-manifest.json"

          greater_args=()
          latest=""
          release_tags="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName')"
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            if go run ./cmd/update-release validate-version --version "$tag" >/dev/null 2>&1; then
              if [[ -z "$latest" ]] || go run ./cmd/update-release validate-version --version "$tag" --greater-than "$latest" >/dev/null 2>&1; then
                latest="$tag"
              fi
            fi
          done <<< "$release_tags"
          if [[ -n "$latest" ]]; then
            greater_args+=(--greater-than "$latest")
          fi
          go run ./cmd/update-release validate-version \
            --version "$version" \
            --confirm "$CONFIRM_VERSION" \
            "${greater_args[@]}"

          go run ./cmd/update-release changelog --file ../CHANGELOG.md --version "$version" > "$RUNNER_TEMP/release-notes.md"
          go run ./cmd/update-release print-ldflags >/dev/null

          derived="$(go run ./cmd/update-release public-key | tr -d '\r\n')"
          expected="$(printf '%s' "$BEEFTV_UPDATER_PUBLIC_KEY" | tr -d '\r\n')"
          if [[ "$derived" != "$expected" ]]; then
            echo "Private key does not derive GitHub variable BEEFTV_UPDATER_PUBLIC_KEY."
            echo "Release binaries and the signed feed must use the same public key."
            exit 1
          fi

          reuse_existing_draft="false"
          if gh release view "$version" >/dev/null 2>&1; then
            if [[ -n "${REUSE_BUILD_RUN_ID:-}" ]]; then
              rel_meta="$(gh release view "$version" --json isDraft,targetCommitish)"
              if [[ "$(jq -r '.isDraft' <<< "$rel_meta")" == "true" && "$(jq -r '.targetCommitish' <<< "$rel_meta")" == "$commit" ]]; then
                reuse_existing_draft="true"
              else
                echo "GitHub release $version already exists and is not a matching draft for $commit."
                exit 1
              fi
            else
              echo "GitHub release $version already exists. Updater version assets are immutable and cannot be overwritten."
              echo "If a failed draft was never published, delete it and its tag only after confirming it was never public."
              exit 1
            fi
          fi
          if git ls-remote --exit-code origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "Git tag $version already exists. Choose a new VERSION; published tags are not reused."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "previous_version=$latest" >> "$GITHUB_OUTPUT"
          echo "reuse_existing_draft=$reuse_existing_draft" >> "$GITHUB_OUTPUT"

      - name: Prepare release gate dependencies
        if: inputs.reuse_build_run_id == ''
        run: |
          sh plugin-packages/build-packages.sh
          cd web
          bun install --frozen-lockfile

      - name: Local release contract gate
        if: inputs.reuse_build_run_id == ''
        run: ./scripts/verify-beeftv-local-release.sh

      - name: Package corresponding WASM source
        if: inputs.reuse_build_run_id == ''
        run: |
          python3 scripts/package-wasm-sources.py \
            --version "${{ steps.meta.outputs.version }}" \
            --binary-dir web/node_modules/@ffmpeg/core/dist/esm

      - uses: actions/upload-artifact@v4
        if: inputs.reuse_build_run_id == ''
        with:
          name: media-wasm-source
          path: dist/BeefTV-${{ steps.meta.outputs.version }}-ffmpeg-wasm-sources.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Create draft GitHub release
        if: steps.meta.outputs.reuse_existing_draft != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --draft \
            --title "BeefTV $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "${{ steps.meta.outputs.commit }}"

  build:
    name: Build ${{ matrix.platform }}
    needs: preflight
    if: inputs.reuse_build_run_id == ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            wails_platform: darwin/arm64
          - os: macos-15-intel
            platform: darwin-amd64
            wails_platform: darwin/amd64
          - os: windows-2022
            platform: windows-amd64
            wails_platform: windows/amd64
          - os: ubuntu-24.04
            platform: linux-amd64
            wails_platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: media-wasm-source
          path: dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Select bundled Node runtime
        shell: bash
        run: |
          node -e 'const fs=require("fs"),p=require("path"); const bin=p.dirname(process.execPath); fs.appendFileSync(process.env.GITHUB_ENV, `BEEFTV_NODE_RUNTIME=${process.platform==="win32"?bin:p.dirname(bin)}\n`);'

      - name: Verify agent host packaging contract
        if: runner.os == 'Linux'
        shell: bash
        run: bun test scripts/package-agent-host.test.mjs

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/configure-ubuntu-apt.sh
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev ffmpeg fonts-noto-cjk xvfb xdotool dbus-x11

      - name: Install MSYS2 UCRT64 GCC
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          release: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils

      - name: Assert DWARF 5 CGO compiler
        if: runner.os == 'Windows'
        env:
          MSYSTEM_PREFIX: ${{ steps.msys2.outputs.msys2-location }}\ucrt64
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-windows-dwarf5-cgo.ps1

      - name: Build official plugin packages
        if: runner.os != 'Windows'
        run: sh plugin-packages/build-packages.sh

      - name: Build macOS or Linux desktop
        if: runner.os != 'Windows'
        env:
          BEEFTV_SKIP_LOCAL_VERIFY: "1"
          BEEFTV_WAILS_PLATFORM: ${{ matrix.wails_platform }}
          BEEFTV_UPDATER_PUBLIC_KEY: ${{ vars.BEEFTV_UPDATER_PUBLIC_KEY }}
        run: ./scripts/build-beeftv-release.sh

      - name: Build Windows desktop
        if: runner.os == 'Windows'
        env:
          BEEFTV_UPDATER_PUBLIC_KEY: ${{ vars.BEEFTV_UPDATER_PUBLIC_KEY }}
          BEEFTV_EXTRA_LDFLAGS: -X infinite-canvas/backend/internal/app.depthWindowsManifestPublicKeyBase64=${{ vars.BEEFTV_UPDATER_PUBLIC_KEY }}
          CGO_ENABLED: "1"
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-beeftv-windows-release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($p in @('backend\cmd\desktop\build\bin\agent-host\runtime\node.exe', 'backend\cmd\desktop\build\bin\agent-host\runtime\npm.cmd', 'backend\cmd\desktop\build\bin\agent-host\runtime\node_modules\npm\bin\npm-cli.js')) {
            if (!(Test-Path -LiteralPath $p -PathType Leaf)) { throw "Missing bundled Windows agent-host file: $p" }
          }

      - name: Verify Windows video disconnect recovery
        if: runner.os == 'Windows'
        working-directory: backend
        env:
          CGO_ENABLED: "1"
        shell: pwsh
        run: |
          go test ./internal/app -run 'TestWindowsVideoConnectionResetRecovery|TestVideoRecoverySocketResetNeverResubmits|TestVideoRecoveryLostReceiptNeverResubmits|TestVideoRecoveryBeefAPIQueryUsesOnlyGet' -count=1 -timeout=120s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis --no-progress -y; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      - name: Package updater zip, incremental delta, and native installer
        working-directory: backend
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PREVIOUS_VERSION: ${{ needs.preflight.outputs.previous_version }}
          PLATFORM: ${{ matrix.platform }}
          BEEFTV_UPDATER_PUBLIC_KEY: ${{ vars.BEEFTV_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          python ../scripts/package-desktop-installer.py --platform "$PLATFORM" &
          installer_pid=$!
          trap 'kill "$installer_pid" 2>/dev/null || true' EXIT
          input="cmd/desktop/build/bin"
          if [[ "$PLATFORM" == darwin-* ]]; then
            input="$input/BeefTV.app"
          elif [[ "$PLATFORM" == linux-amd64 ]]; then
            input="$input/BeefTV-linux"
          fi
          go run ./cmd/update-release package \
            --platform "$PLATFORM" \
            --input "$input" \
            --output "../dist/BeefTV-${VERSION}-${PLATFORM}.zip"
          if [[ -n "${PREVIOUS_VERSION:-}" ]] && python -c 'import os, re, sys; m = re.match(r"^v(\d+)\.(\d+)\.(\d+)$", os.environ["VERSION"]); sys.exit(0 if m and (int(m[1]), int(m[2]), int(m[3])) >= (2, 1, 0) else 1)'; then
            if curl --fail --silent --show-error --location --retry 3 --max-time 60 \
              "${UPDATER_DOWNLOAD_BASE}/${PREVIOUS_VERSION}/desktop-update.json" \
              -o "$RUNNER_TEMP/prev-desktop-update.json" && \
              go run ./cmd/update-release verify \
                --envelope "$RUNNER_TEMP/prev-desktop-update.json" \
                --public-key-text "$BEEFTV_UPDATER_PUBLIC_KEY" && \
              curl --fail --silent --show-error --location --retry 3 --max-time 600 \
                "${UPDATER_DOWNLOAD_BASE}/${PREVIOUS_VERSION}/BeefTV-${PREVIOUS_VERSION}-${PLATFORM}.zip" \
                -o "$RUNNER_TEMP/BeefTV-${PREVIOUS_VERSION}-${PLATFORM}.zip"; then
              go run ./cmd/update-release build-delta \
                --platform "$PLATFORM" \
                --from-version "$PREVIOUS_VERSION" \
                --to-version "$VERSION" \
                --from-zip "$RUNNER_TEMP/BeefTV-${PREVIOUS_VERSION}-${PLATFORM}.zip" \
                --to-zip "../dist/BeefTV-${VERSION}-${PLATFORM}.zip" \
                --output "../dist/BeefTV-${VERSION}-${PLATFORM}-from-${PREVIOUS_VERSION}.delta.zip"
            else
              echo "::warning::Previous release ${PREVIOUS_VERSION} ${PLATFORM} zip unavailable; skipping delta archive."
            fi
          fi
          if ! wait "$installer_pid"; then
            echo "::error::Native installer packaging failed"
            exit 1
          fi
          trap - EXIT
          python ../scripts/smoke-packaged-cli_test.py
          python ../scripts/smoke-packaged-cli.py --archive "../dist/BeefTV-${VERSION}-${PLATFORM}.zip" --platform "$PLATFORM"

      - name: Verify native installer lifecycle
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          payload='backend/cmd/desktop/build/bin'
          suffix='-setup.exe'
          if [[ "$PLATFORM" == darwin-* ]]; then payload="$payload/BeefTV.app"; suffix='.dmg'; fi
          if [[ "$PLATFORM" == linux-* ]]; then payload="$payload/BeefTV-linux"; suffix='.deb'; fi
          command=(python scripts/smoke-desktop-installer.py --platform "$PLATFORM" --installer "dist/BeefTV-${VERSION}-${PLATFORM}${suffix}" --payload "$payload")
          if [[ "$PLATFORM" == linux-* ]]; then xvfb-run -a dbus-run-session -- "${command[@]}"; else "${command[@]}"; fi

      - name: Verify upgrades from released Windows clients
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/test-windows-published-upgrade.py --archive "dist/BeefTV-${{ needs.preflight.outputs.version }}-windows-amd64.zip" --version "${{ needs.preflight.outputs.version }}" --output dist/windows-upgrade-evidence.json

      - name: Verify Linux desktop window from final archive
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- python3 scripts/smoke-linux-desktop.py --archive "dist/BeefTV-${{ needs.preflight.outputs.version }}-linux-amd64.zip"

      - name: Preserve Windows upgrade acceptance
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-upgrade-evidence
          path: dist/windows-upgrade-evidence.json

      - name: Store platform zip for publication
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            dist/BeefTV-${{ needs.preflight.outputs.version }}-${{ matrix.platform }}*
            dist/BeefTV-${{ needs.preflight.outputs.version }}-ffprobe-${{ matrix.platform }}-sources.tar.gz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Sign feed and publish
    needs: [preflight, build]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.reuse_build_run_id != '')) }}
    outputs:
      activated: ${{ steps.activate.outcome == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.preflight.outputs.version }}
      PREVIOUS_VERSION: ${{ needs.preflight.outputs.previous_version }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
      BEEFTV_UPDATER_PRIVATE_KEY: ${{ secrets.BEEFTV_UPDATER_PRIVATE_KEY }}
      BEEFTV_UPDATER_PUBLIC_KEY: ${{ vars.BEEFTV_UPDATER_PUBLIC_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BEEFTV_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BEEFTV_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Retrieve completed platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.reuse_build_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Retrieve corresponding WASM source
        uses: actions/download-artifact@v4
        with:
          name: media-wasm-source
          path: dist
          run-id: ${{ inputs.reuse_build_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Check release publisher tooling
        run: |
          python3 -m unittest discover -s scripts -p 'test_publish_desktop_r2.py'
          python3 -m unittest discover -s scripts -p 'test_desktop_cos_store.py'
          cd backend
          go build -o "$RUNNER_TEMP/update-release" ./cmd/update-release

      - name: Check complete platform set
        run: |
          set -euo pipefail
          mapfile -t zips < <(find dist -maxdepth 1 -name "BeefTV-${VERSION}-*.zip" ! -name "*.delta.zip" | LC_ALL=C sort)
          if [[ "${#zips[@]}" -ne 4 ]]; then
            echo "Expected 4 platform zips on draft $VERSION before signing desktop-update.json, found ${#zips[@]}."
            printf '%s\n' "${zips[@]}"
            exit 1
          fi
          for name in "darwin-arm64.dmg" "darwin-amd64.dmg" "windows-amd64-setup.exe" "linux-amd64.deb"; do
            test -s "dist/BeefTV-${VERSION}-${name}"
          done
          if [[ -n "${PREVIOUS_VERSION:-}" ]]; then
            delta_count=0
            for platform in darwin-arm64 darwin-amd64 windows-amd64 linux-amd64; do
              if [[ -s "dist/BeefTV-${VERSION}-${platform}-from-${PREVIOUS_VERSION}.delta.zip" ]]; then
                delta_count=$((delta_count + 1))
              fi
            done
            if [[ "$delta_count" -ne 4 ]]; then
              echo "::warning::Found ${delta_count}/4 delta archives from ${PREVIOUS_VERSION}; omitting incomplete delta set."
              rm -f dist/BeefTV-"${VERSION}"-*-from-"${PREVIOUS_VERSION}".delta.zip
            fi
          fi

      - name: Sign and verify desktop-update.json
        working-directory: backend
        run: |
          set -euo pipefail
          go run ./cmd/update-release sign \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --changelog ../CHANGELOG.md \
            --download-base "$UPDATER_DOWNLOAD_BASE" \
            --expect-public-key "$BEEFTV_UPDATER_PUBLIC_KEY" \
            --require-platforms darwin-arm64,darwin-amd64,windows-amd64,linux-amd64 \
            --asset "darwin-arm64=../dist/BeefTV-${VERSION}-darwin-arm64.zip" \
            --asset "darwin-amd64=../dist/BeefTV-${VERSION}-darwin-amd64.zip" \
            --asset "windows-amd64=../dist/BeefTV-${VERSION}-windows-amd64.zip" \
            --asset "linux-amd64=../dist/BeefTV-${VERSION}-linux-amd64.zip" \
            --output "../dist/desktop-update.json"
          go run ./cmd/update-release verify \
            --envelope "../dist/desktop-update.json" \
            --public-key-text "$BEEFTV_UPDATER_PUBLIC_KEY"
          if python3 -c 'import os, re, sys; m = re.match(r"^v(\d+)\.(\d+)\.(\d+)$", os.environ["VERSION"]); sys.exit(0 if m and (int(m[1]), int(m[2]), int(m[3])) >= (2, 1, 0) else 1)'; then
            delta_args=()
            if [[ -n "${PREVIOUS_VERSION:-}" ]] && [[ -s "../dist/BeefTV-${VERSION}-darwin-arm64-from-${PREVIOUS_VERSION}.delta.zip" ]]; then
              for platform in darwin-arm64 darwin-amd64 windows-amd64 linux-amd64; do
                delta_args+=(--delta "${platform}=${PREVIOUS_VERSION}=../dist/BeefTV-${VERSION}-${platform}-from-${PREVIOUS_VERSION}.delta.zip")
              done
            fi
            go run ./cmd/update-release sign \
              --schema 2 \
              --version "$VERSION" \
              --from-envelope "../dist/desktop-update.json" \
              --download-base "$UPDATER_DOWNLOAD_BASE" \
              --expect-public-key "$BEEFTV_UPDATER_PUBLIC_KEY" \
              "${delta_args[@]}" \
              --output "../dist/desktop-update-v2-r2.json"
            go run ./cmd/update-release verify \
              --envelope "../dist/desktop-update-v2-r2.json" \
              --public-key-text "$BEEFTV_UPDATER_PUBLIC_KEY"
          fi

      - name: Stage and verify immutable R2 assets
        run: |
          set -euo pipefail
          v2_args=()
          if [[ -f dist/desktop-update-v2-r2.json ]]; then
            v2_args+=(--manifest-v2 dist/desktop-update-v2-r2.json)
          fi
          python3 scripts/publish-desktop-r2.py stage \
            --manifest dist/desktop-update.json --assets-dir dist --with-installers \
            "${v2_args[@]}" \
            --verification-receipt "$RUNNER_TEMP/release-public-verification.json" \
            --verifier "$RUNNER_TEMP/update-release" --provider r2 \
            --endpoint-url "$RELEASE_ENDPOINT" --region "$RELEASE_REGION" \
            --bucket "$RELEASE_BUCKET" --public-base "$UPDATER_DOWNLOAD_BASE"

      - name: Publish signed GitHub release
        run: |
          set -euo pipefail
          gh release upload "$VERSION" --clobber "dist/desktop-update.json" dist/BeefTV-"$VERSION"-*.zip dist/BeefTV-"$VERSION"-*.dmg dist/BeefTV-"$VERSION"-*-setup.exe dist/BeefTV-"$VERSION"-*.deb dist/BeefTV-"$VERSION"-ffprobe-darwin-*-sources.tar.gz dist/BeefTV-"$VERSION"-ffmpeg-wasm-sources.tar.gz
          gh release edit "$VERSION" --draft=false --latest

      - name: Activate verified R2 update feed
        id: activate
        run: |
          python3 scripts/publish-desktop-r2.py activate \
            --manifest dist/desktop-update.json --assets-dir dist --with-installers \
            --verification-receipt "$RUNNER_TEMP/release-public-verification.json" \
            --verifier "$RUNNER_TEMP/update-release" --provider r2 \
            --endpoint-url "$RELEASE_ENDPOINT" --region "$RELEASE_REGION" \
            --bucket "$RELEASE_BUCKET" --public-base "$UPDATER_DOWNLOAD_BASE"

      - name: Activate initial R2-only desktop-update-v2.json
        if: steps.activate.outcome == 'success'
        run: |
          set -euo pipefail
          if [[ -f dist/desktop-update-v2-r2.json ]]; then
            python3 scripts/publish-desktop-r2.py activate-v2 \
              --manifest dist/desktop-update-v2-r2.json \
              --verifier "$RUNNER_TEMP/update-release" --provider r2 \
              --endpoint-url "$RELEASE_ENDPOINT" --region "$RELEASE_REGION" \
              --bucket "$RELEASE_BUCKET" --public-base "$UPDATER_DOWNLOAD_BASE"
          fi
          echo "Published $VERSION at $BEEFTV_UPDATER_FEED_URL."

      - name: Bridge activated feed for existing COS clients
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BEEFTV_COS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BEEFTV_COS_SECRET_ACCESS_KEY }}
        run: |
          python3 scripts/publish-desktop-r2.py bridge-cos \
            --manifest dist/desktop-update.json --verifier "$RUNNER_TEMP/update-release" \
            --provider cos --endpoint-url "$LEGACY_COS_ENDPOINT" --region "$LEGACY_COS_REGION" \
            --bucket "$LEGACY_COS_BUCKET"

  mirror:
    name: Verify CNB mirror and publish domestic v2 feed
    needs: [preflight, publish]
    if: ${{ !cancelled() && needs.publish.outputs.activated == 'true' }}
    uses: ./.github/workflows/mirror-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
    secrets:
      BEEFTV_CNB_TRIGGER_TOKEN: ${{ secrets.BEEFTV_CNB_TRIGGER_TOKEN }}
      BEEFTV_UPDATER_PRIVATE_KEY: ${{ secrets.BEEFTV_UPDATER_PRIVATE_KEY }}
      BEEFTV_R2_ACCESS_KEY_ID: ${{ secrets.BEEFTV_R2_ACCESS_KEY_ID }}
      BEEFTV_R2_SECRET_ACCESS_KEY: ${{ secrets.BEEFTV_R2_SECRET_ACCESS_KEY }}
