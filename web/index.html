<!doctype html>
<html lang="zh-CN" class="dark font-sans" style="color-scheme: dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="qisiTV，本地优先的开源 AI 视频创作工作台。" />
        <link rel="icon" href="/qisitv-mark.svg" type="image/svg+xml" />
        <title>qisiTV</title>
        <style>
            html,
            body {
                margin: 0;
                background: #0f0f0f;
            }
            #root:empty {
                min-height: 100vh;
            }
            #root:empty::before {
                content: "";
                position: fixed;
                left: 50%;
                top: 50%;
                width: 12px;
                height: 12px;
                margin: -6px 0 0 -6px;
                background: rgba(255, 255, 255, 0.84);
                border-radius: 999px;
                box-shadow: 0 0 0 7px rgba(255, 255, 255, 0.08);
                animation: appearance-bootstrap-pulse 1.8s ease-in-out infinite;
            }
            #root:empty::after {
                content: "";
                position: fixed;
                left: 50%;
                top: 50%;
                width: 82px;
                height: 82px;
                margin: -42px 0 0 -42px;
                border: 1px solid rgba(255, 255, 255, 0.14);
                border-right-color: transparent;
                border-radius: 999px;
                animation: appearance-bootstrap-orbit 2.8s linear infinite;
            }
            @keyframes appearance-bootstrap-pulse { 0%, 100% { opacity: .62; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.08); } }
            @keyframes appearance-bootstrap-orbit { to { transform: rotate(360deg); } }
            @media (prefers-reduced-motion: reduce) {
                #root:empty::before,
                #root:empty::after {
                    animation: none;
                }
            }
        </style>
        <script>
            // qisiTV is dark-first. Apply the invariant before React mounts so a
            // missing, stale or corrupted preference cannot produce a white flash.
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
        </script>
    </head>
    <body class="bg-background text-foreground antialiased" style="background:#0f0f0f">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
