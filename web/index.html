<!doctype html>
<html lang="zh-CN" class="dark font-sans" style="color-scheme: dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="qisiTV，本地优先的开源 AI 视频创作工作台。" />
        <link rel="icon" href="%BASE_URL%qisitv-logo.jpg" type="image/jpeg" />
        <title>qisiTV</title>
        <style>
            html,
            body {
                margin: 0;
                background: var(--background, #0f0f0f);
            }
            #root:empty {
                position: fixed;
                inset: 0;
                min-height: 100vh;
                overflow: hidden;
                background: #090909;
            }
            #root:empty::after {
                content: "";
                position: absolute;
                left: 50%;
                top: 50%;
                width: min(240px, 42vw);
                aspect-ratio: 17 / 10;
                transform: translate(-50%, -50%);
                background: linear-gradient(105deg, #c9c9c9 0%, #e4e4e4 43%, #fff 49%, #fff 52%, #e4e4e4 58%, #c9c9c9 100%);
                background-size: 240% 100%;
                background-position: 100% 0;
                -webkit-mask: url('/beef-logo.png') center / contain no-repeat;
                mask: url('/beef-logo.png') center / contain no-repeat;
                animation: appearance-bootstrap-shimmer 2.6s ease-in-out infinite;
            }
            @keyframes appearance-bootstrap-shimmer {
                0%, 12% { background-position: 100% 0; }
                82%, 100% { background-position: 0 0; }
            }
            @media (prefers-reduced-motion: reduce) {
                #root:empty::after {
                    animation: none;
                    background: #f2f2f2;
                }
            }
        </style>
        <script>
            // Match the saved preference before the first paint; invalid storage stays dark.
            let theme = "dark";
            try {
                if (JSON.parse(localStorage.getItem("infinite-canvas:theme_store"))?.state?.theme === "light") theme = "light";
            } catch {}
            document.documentElement.classList.toggle("dark", theme === "dark");
            document.documentElement.style.colorScheme = theme;
            document.documentElement.style.setProperty("--background", theme === "dark" ? "#0f0f0f" : "#f5f5f5");
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
